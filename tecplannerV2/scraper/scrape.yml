name: Actualizar datos de TEC Planner

on:
  schedule:
    - cron: '0 6 * * *' # todos los días 06:00 UTC — revisar-ventana.js decide si hoy toca scrapear
  workflow_dispatch:
    inputs:
      anio:
        description: 'Año a scrapear (fuerza una corrida manual, ignora las ventanas de fecha)'
        required: false
      periodo:
        description: 'Período a scrapear: 1, 2, 1V, 2V... (opcional, solo aplica junto con "anio")'
        required: false
      fecha_simulada:
        description: 'Solo para probar ventanas.js: fecha YYYY-MM-DD a simular. No scrapea, solo muestra qué haría el cron ese día.'
        required: false

# Evita que dos corridas (ej. el cron diario y un disparo manual) intenten
# empujar cambios a git al mismo tiempo.
concurrency:
  group: tecplanner-scraper
  cancel-in-progress: false

jobs:
  # --- Modo prueba: simula una fecha contra ventanas.js sin scrapear nada ---
  probar-ventana:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.fecha_simulada != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - working-directory: scraper
        env:
          FECHA_SIMULADA: ${{ github.event.inputs.fecha_simulada }}
        run: node revisar-ventana.js

  # --- Cron diario: decide si hoy cae dentro de alguna ventana de matrícula ---
  revisar-ventana:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    outputs:
      ventanas: ${{ steps.revisar.outputs.ventanas }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - id: revisar
        working-directory: scraper
        run: node revisar-ventana.js

  # --- Scraping programado: una corrida por cada ventana activa hoy ---
  scrape-programado:
    needs: revisar-ventana
    if: github.event_name == 'schedule' && needs.revisar-ventana.outputs.ventanas != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      matrix:
        ventana: ${{ fromJson(needs.revisar-ventana.outputs.ventanas) }}
      max-parallel: 1 # secuencial: evita conflictos de "git push" entre ventanas del mismo día
      fail-fast: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Ejecutar scraper
        working-directory: scraper
        env:
          SCRAPER_ANIO: ${{ matrix.ventana.anio }}
          SCRAPER_PERIODO: ${{ matrix.ventana.periodo }}
        run: npm run scrape

      - name: Publicar cambios si hay datos nuevos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add scraper/data scraper/output
          if git diff --cached --quiet; then
            echo "Sin cambios, nada que publicar."
          else
            git commit -m "chore: actualizar datos del TEC [automático, ${{ matrix.ventana.anio }}/${{ matrix.ventana.periodo || 'todos' }}]"
            git pull --rebase
            git push
          fi

  # --- Modo manual: año/período forzados a mano, ignora las ventanas ---
  scrape-manual:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.anio != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Ejecutar scraper
        working-directory: scraper
        env:
          SCRAPER_ANIO: ${{ github.event.inputs.anio }}
          SCRAPER_PERIODO: ${{ github.event.inputs.periodo }}
        run: npm run scrape

      - name: Publicar cambios si hay datos nuevos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add scraper/data scraper/output
          if git diff --cached --quiet; then
            echo "Sin cambios, nada que publicar."
          else
            git commit -m "chore: actualizar datos del TEC [manual]"
            git pull --rebase
            git push
          fi